<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico">
    <title>Mages</title>
    <style>
        :root {
            color-scheme: dark;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
            color: #bbb;
            font-family: system-ui, sans-serif;
        }

        #boot {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
        }

        .boot-inner {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #342f9a;
            border-top-color: #bbb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .boot-error {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 420px;
            text-align: center;
            line-height: 1.5;
        }

        .boot-error button {
            padding: 8px 16px;
            color: #eee;
            background: #342f9a;
            border: 0;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="boot">
        <div class="boot-inner" id="boot-loading">
            <div class="spinner"></div>
        </div>
        <div class="boot-error" id="boot-error">
            <span>The app files could not be loaded. This usually means a newer version was just deployed.</span>
            <button id="boot-reload">Reload</button>
        </div>
    </div>

    <script>
        const currentLanguagesImplementation = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        const newLanguagesImplementation = Object.assign({}, currentLanguagesImplementation, {
            get: function () {
                if (window.__customLocale) {
                    return [window.__customLocale];
                }
                return currentLanguagesImplementation.get.apply(this);
            }
        });
        Object.defineProperty(Navigator.prototype, "languages", newLanguagesImplementation);

        const reloadWithBust = () => {
            const url = new URL(location.href);
            url.searchParams.set("_mages_reload", Date.now().toString());
            location.replace(url.toString());
        };
        const showBootError = () => {
            document.getElementById("boot-loading").style.display = "none";
            document.getElementById("boot-error").style.display = "flex";
        };
        document.getElementById("boot-reload").addEventListener("click", reloadWithBust);
        const originalFetch = window.fetch.bind(window);
        window.fetch = (input, init) => originalFetch(input, init).then((response) => {
            const url = typeof input === "string" ? input : input.url;
            if (url.includes(".wasm") && response.headers.get("Content-Type") !== "application/wasm") {
                throw new Error("WebAssembly asset returned " + response.headers.get("Content-Type"));
            }
            return response;
        });
        window.addEventListener("unhandledrejection", (event) => {
            if (String(event.reason).includes("WebAssembly") || String(event.reason).includes("wasm")) {
                showBootError();
            }
        });
        setTimeout(() => {
            if (!window.__magesBooted) showBootError();
        }, 20000);
    </script>
    <script type="module">
        import wasmInit, { setLogConfig } from "./wasm/mages_ffi.js";
        window.__magesSetLogConfig = setLogConfig;
        try {
            await wasmInit();
        } catch (error) {
            showBootError();
            throw error;
        }
        await import("./mages.js");
    </script>
</body>

</html>
