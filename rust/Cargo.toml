[package]
name = "mages_ffi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/mlm-games/Mages"
description = "Mages FFI (matrix-sdk)"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["."]

[dependencies]
once_cell = "1.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

uniffi = { version = "0.32", features = ["wasm-unstable-single-threaded"] }
uniffi_bindgen = "0.32.0"

getrandom = "0.4"

blake3 = "1"
uuid = { version = "1.26", features = ["v4"] }
mime = "0.3"
js_int = "0.2"
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Header-only dimension reads for `info` on uploaded pack images. No decode,
# no re-encode: the picker already previews through the homeserver's
# `/thumbnail` endpoint, so nothing here needs pixel data.
imagesize = { version = "0.15", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
blurhash = { version = "0.2", features = ["image"] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
futures-util = "0.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
] }
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
web-time = "1.1"
async-stream = "0.3.6"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
log-panics = { version = "2", features = ["with-backtrace"] }
qrcode = { version = "0.14", default-features = false }
matrix-sdk = { version = "0.19.0", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    "bundled-sqlite",
    "sso-login",
    "socks",
    "qrcode",
    "automatic-room-key-forwarding",
    "experimental-search",
    "experimental-widgets",
    "rustls-aws-lc-rs",
    # "uniffi",
] }
matrix-sdk-ui = { version = "0.19.0", default-features = false }
matrix-sdk-base = { version = "0.19.0", default-features = false }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "fs",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
matrix-sdk = { version = "0.19.0", default-features = false, features = [
    "e2e-encryption",
    "indexeddb",
    # "sso-login",  # Disabled - pulls in axum -> doesn't support wasm
    "automatic-room-key-forwarding",
    # "experimental-search",  # Disabled - tantivy -> fs4 -> rustix -> errno, no wasm support
    "experimental-widgets",
    "rustls-aws-lc-rs",
] }
matrix-sdk-ui = { version = "0.19.0", default-features = false, features = [
    "js",
] }
matrix-sdk-base = { version = "0.19.0", default-features = false }
# tokio fs feautre - not supported on wasm
tokio = { version = "1", features = ["rt", "macros", "time"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
js-sys = "0.3.104"
web-sys = { version = "0.3.104", features = [
    "Location",
    "Window",
    "Document",
    "Storage",
    "IdbFactory",
    "IdbOpenDbRequest",
] }
gloo-timers = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# Disable gzip/brotli/zstd to avoid tower-http -> tokio -> mio
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
robius-location = "=0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "=0.3.1"

[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
jni = "0.22"
jvm-getter = "0.1.0"
once_cell = "1.21"
paranoid-android = { version = "0.2", default-features = false }

[build-dependencies]
getrandom = "0.4"
uniffi = { version = "0.32", features = ["build"] }
uniffi_bindgen = "0.32.0"

[patch.crates-io]
matrix-sdk = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
matrix-sdk-base = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
matrix-sdk-common = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
matrix-sdk-crypto = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
matrix-sdk-sqlite = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
matrix-sdk-store-encryption = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
matrix-sdk-ui = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
matrix-sdk-search = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
matrix-sdk-indexeddb = { git = "https://github.com/mlm-games/matrix-rust-sdk", branch = "media-metrics" }
